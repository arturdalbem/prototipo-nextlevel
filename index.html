<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10162f">
<title>NextLevel — Cresça na carreira. Conquiste sua independência.</title>
<style>
:root{--navy:#10162f;--navy2:#192344;--violet:#7457e8;--violet2:#a18cff;--orange:#ff963d;--bg:#f5f6fb;--card:#fff;--ink:#202642;--muted:#727991;--line:#e5e8f1;--green:#16845d;--red:#c84d59;--shadow:0 14px 36px #17204412}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:72px;background:var(--navy);color:white;display:flex;align-items:center;gap:28px;padding:0 max(24px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:10}.brand{font-size:22px;font-weight:850;letter-spacing:-.8px;white-space:nowrap}.brand em{font-style:normal;color:var(--orange)}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,var(--violet),#4a39ae);margin-right:8px;font-size:16px}.nav{display:flex;gap:5px;align-items:center;flex:1}.nav a,.nav button{border:0;background:none;color:#dce1f6;padding:10px 12px;border-radius:10px;font-weight:650}.nav a.active,.nav a:hover,.nav button:hover{background:#ffffff18;color:#fff}.right{margin-left:auto;display:flex;align-items:center;gap:10px}.user-pill{color:#fff;background:#ffffff16;border:1px solid #ffffff22;border-radius:999px;padding:8px 12px}.menu-toggle{display:none;background:none;border:1px solid #ffffff44;color:#fff;border-radius:10px;padding:8px 12px}.container{max-width:1180px;margin:auto;padding:34px 24px 70px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;color:var(--violet)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,4vw,48px);line-height:1.08;letter-spacing:-1.7px;margin-bottom:14px}h2{font-size:24px;letter-spacing:-.5px;margin-bottom:14px}h3{font-size:17px;margin-bottom:6px}.muted{color:var(--muted)}.small{font-size:13px}.hero{background:radial-gradient(circle at 85% 20%,#5541a5 0,transparent 34%),linear-gradient(120deg,#111832,#202a53);border-radius:26px;padding:52px;color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff20;border-radius:50%;right:7%;bottom:-170px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff06}.hero h1{max-width:690px}.hero h1 span{color:#ffb56d}.hero p{color:#d8def3;max-width:600px;font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:11px 17px;background:linear-gradient(110deg,var(--violet),#5945c8);color:white;font-weight:750;box-shadow:0 6px 16px #6953d42a}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.orange{background:var(--orange);color:#251b16;box-shadow:none}.btn.danger{background:#fff0f1;color:var(--red);box-shadow:none}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow)}.feature-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#f0edff;color:var(--violet);font-size:21px;margin-bottom:13px}.stat-label{font-size:13px;color:var(--muted);font-weight:650}.stat-value{font-size:28px;font-weight:850;letter-spacing:-.8px;margin:5px 0}.stat-note{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:34px 0 14px}.section-head h2{margin:0}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f0edff;color:#5b47c1;font-size:11px;font-weight:800}.tag.orange{background:#fff1e4;color:#a65719}.tag.green{background:#e7f6ef;color:#18724f}.progress{height:8px;background:#eceef5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--orange));border-radius:99px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}.field label{font-size:13px;font-weight:750}.field input,.field select{width:100%;border:1px solid #dfe3ef;border-radius:11px;padding:11px 12px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #7457e81a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span-2{grid-column:span 2}.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}.amount-in{color:var(--green);font-weight:800}.amount-out{color:var(--red);font-weight:800}.empty{padding:25px;text-align:center;border:1px dashed #d9ddeb;border-radius:14px;color:var(--muted)}.course-card{display:flex;flex-direction:column;min-height:235px}.course-card .course-bottom{margin-top:auto;padding-top:16px}.course-card p{font-size:13px;color:var(--muted)}.course-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}.notice{padding:14px 16px;border-radius:13px;background:#fff6e9;border:1px solid #ffe2bd;color:#71491e;font-size:13px}.notice.blue{background:#f0efff;border-color:#dfd9ff;color:#51428c}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:white;color:var(--muted);font-weight:700}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}.modal-backdrop{position:fixed;inset:0;background:#0c1229a8;z-index:30;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 25px 80px #0004}.modal h2{margin-bottom:8px}.modal-close{float:right;border:0;background:#f1f2f7;border-radius:9px;padding:6px 10px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy);color:white;padding:12px 17px;border-radius:12px;z-index:50;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.auth-wrap{max-width:500px;margin:20px auto}.footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}.footer a{text-decoration:underline}.hidden{display:none!important}.chart-bars{height:150px;display:flex;align-items:end;gap:12px;padding-top:10px}.chart-bars div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.chart-bars i{display:block;background:linear-gradient(180deg,var(--violet2),var(--violet));border-radius:8px 8px 0 0;min-height:4px;margin-bottom:7px}.goal-circle{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--violet) var(--pct),#eceef5 0);position:relative}.goal-circle:before{content:"";position:absolute;inset:9px;background:white;border-radius:50%}.goal-circle strong{position:relative;font-size:20px}.mobile-only{display:none}
@media(max-width:850px){.topbar{padding:0 18px;gap:12px}.menu-toggle{display:block}.nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--navy);padding:12px 18px 18px;align-items:stretch;flex-direction:column}.nav.open{display:flex}.nav a,.nav button{text-align:left}.right{margin-left:auto}.col-3{grid-column:span 6}.col-4,.col-5,.col-6,.col-7,.col-8{grid-column:span 12}.hero{padding:35px 25px}}
@media(max-width:560px){.container{padding:22px 15px 50px}.topbar{height:64px}.nav{top:64px}.brand{font-size:19px}.user-pill{display:none}.col-3{grid-column:span 12}.form-grid{grid-template-columns:1fr}.span-2{grid-column:span 1}.hero{padding:29px 21px;border-radius:20px}.hero p{font-size:15px}.section-head{align-items:start;flex-direction:column}.card{padding:17px}}
</style>
</head>
<body><div class="shell" id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='nextlevel_demo_v2';
const seed={user:null,transactions:[{id:1,type:'out',description:'Mercado',category:'Alimentação',amount:420,date:'2026-11-04'},{id:2,type:'out',description:'Transporte',category:'Transporte',amount:145,date:'2026-11-08'},{id:3,type:'out',description:'Internet',category:'Moradia',amount:99.9,date:'2026-11-10'},{id:4,type:'in',description:'Bolsa / salário',category:'Renda',amount:2200,date:'2026-11-01'}],goal:{name:'Reserva de emergência',target:3000,saved:850},premium:false,progress:{},filter:'Todas'};
let state=load();
function load(){try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const areas=['Tecnologia','Saúde','Administração','Marketing','Direito','Engenharia','Educação'];
const courses=[
{area:'Tecnologia',title:'Lógica de programação',desc:'Entenda variáveis, condições e laços com exercícios curtos.',duration:'20 min',level:'Básico'},
{area:'Tecnologia',title:'Excel para dados',desc:'Fórmulas, organização de planilhas e tabelas dinâmicas.',duration:'30 min',level:'Básico'},
{area:'Saúde',title:'Atendimento humanizado',desc:'Comunicação, acolhimento e experiência do paciente.',duration:'25 min',level:'Básico'},
{area:'Administração',title:'Fluxo de caixa',desc:'Controle entradas, saídas e acompanhe o caixa.',duration:'20 min',level:'Básico'},
{area:'Marketing',title:'Redes sociais para negócios',desc:'Planeje conteúdo e acompanhe métricas essenciais.',duration:'25 min',level:'Básico'},
{area:'Direito',title:'Direitos básicos do trabalhador',desc:'Conheça conceitos importantes da relação de trabalho.',duration:'25 min',level:'Básico'},
{area:'Engenharia',title:'Orçamento de projetos',desc:'Noções de custos, prazos e planejamento.',duration:'25 min',level:'Básico'},
{area:'Educação',title:'Planejamento de aulas',desc:'Organize objetivos, atividades e avaliação.',duration:'20 min',level:'Básico'},
{area:'Tecnologia',title:'Python aplicado a dados',desc:'Construa pequenos projetos de análise e automação.',duration:'6 h',level:'Premium'},
{area:'Saúde',title:'Gestão de clínicas',desc:'Conheça processos, agenda, indicadores e atendimento.',duration:'5 h',level:'Premium'},
{area:'Administração',title:'Planejamento financeiro empresarial',desc:'Orçamento, indicadores e tomada de decisão.',duration:'5 h',level:'Premium'},
{area:'Marketing',title:'Tráfego pago e métricas',desc:'Estruture campanhas e interprete resultados.',duration:'6 h',level:'Premium'},
{area:'Direito',title:'Contratos na prática',desc:'Noções de elaboração, análise e negociação.',duration:'6 h',level:'Premium'},
{area:'Engenharia',title:'Gestão de obras',desc:'Planejamento, medição e controle de custos.',duration:'7 h',level:'Premium'},
{area:'Educação',title:'Tecnologias na educação',desc:'Explore ferramentas digitais aplicadas à aprendizagem.',duration:'4 h',level:'Premium'}
];
let page=location.hash.slice(1)||'inicio',courseFilter='Todas';
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function go(p){page=p;location.hash=p;render()}
function totals(){return state.transactions.reduce((a,t)=>(a[t.type]+=Number(t.amount),a),{in:0,out:0})}
function nav(){const links=[['painel','Visão geral'],['financas','Finanças'],['metas','Metas'],['cursos','Cursos'],['grupos','Comunidade']];return '<header class="topbar"><a class="brand" href="#inicio"><span class="brand-mark">↗</span>Next<em>Level</em></a><button class="menu-toggle" onclick="toggleNav()">☰</button><nav class="nav" id="nav">'+links.map(([p,l])=>'<a class="'+(page===p?'active':'')+'" href="#'+p+'">'+l+'</a>').join('')+'</nav><div class="right">'+(state.user?'<span class="user-pill">Olá, '+esc(state.user.name.split(' ')[0])+'</span><button class="btn secondary" onclick="logout()">Sair</button>':'<a class="btn secondary" href="#login">Entrar</a>')+'</div></header>'}
function layout(content){document.getElementById('app').innerHTML=nav()+'<main class="container">'+content+'</main><footer class="footer">NextLevel • Protótipo demonstrativo • <a href="#sobre">Sobre o projeto</a> • <a href="#privacidade">Privacidade</a></footer>'}
function landing(){layout('<section class="hero"><div class="eyebrow" style="color:#c3b6ff">Carreira + organização financeira</div><h1>Cresça na carreira.<br><span>Conquiste sua independência.</span></h1><p>Desenvolva habilidades profissionais e organize seu dinheiro em um só lugar. Um passo de cada vez, no seu ritmo.</p><div class="actions"><a class="btn orange" href="#cadastro">Começar gratuitamente</a><a class="btn secondary" href="#sobre">Conhecer o NextLevel</a></div></section><div class="section-head"><div><div class="eyebrow">Dois pilares, um objetivo</div><h2>Seu próximo passo começa aqui</h2></div></div><div class="grid"><article class="card col-4"><div class="feature-icon">▤</div><span class="tag green">Gratuito</span><h3>Organização financeira</h3><p class="muted">Registre receitas e despesas, acompanhe seu saldo e defina objetivos financeiros.</p></article><article class="card col-4"><div class="feature-icon">✦</div><span class="tag orange">Premium • R$ 9,99/mês</span><h3>Desenvolvimento profissional</h3><p class="muted">Acesse uma biblioteca de cursos básicos por área com uma assinatura acessível.</p></article><article class="card col-4"><div class="feature-icon">◎</div><span class="tag green">Gratuito</span><h3>Comunidade</h3><p class="muted">Troque experiências, ideias e informações com pessoas de diferentes áreas.</p></article></div><div class="notice blue" style="margin-top:20px">O NextLevel está em fase de protótipo. Cursos, parcerias e valores são propostas do modelo de negócio e ainda precisam ser validados.</div>')}
function auth(kind){const signup=kind==='cadastro';layout('<div class="auth-wrap card"><div class="eyebrow">'+(signup?'Crie sua conta':'Acesse sua conta')+'</div><h2>'+(signup?'Comece sua jornada':'Bem-vindo de volta')+'</h2><p class="muted small">'+(signup?'O planejamento financeiro e a comunidade são gratuitos.':'Entre para acompanhar sua evolução.')+'</p><form onsubmit="authSubmit(event,''+kind+'')">'+(signup?'<div class="field"><label>Nome</label><input name="name" required minlength="2" autocomplete="name"></div>':'')+'<div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input name="password" type="password" required minlength="6" autocomplete="'+(signup?'new-password':'current-password')+'"></div>'+(signup?'<div class="field"><label>Área de interesse</label><select name="area"><option value="">Selecione</option>'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></div>':'')+'<button class="btn" type="submit">'+(signup?'Criar conta':'Entrar')+'</button></form><p class="muted small" style="margin:16px 0 0">'+(signup?'Já tem conta? <a href="#login">Entrar</a>':'Ainda não tem conta? <a href="#cadastro">Criar conta</a>')+'</p><p class="muted small">Demonstração: os dados ficam salvos apenas neste navegador.</p></div>')}
function authSubmit(e,kind){e.preventDefault();const f=new FormData(e.target);if(kind==='cadastro'){state.user={name:f.get('name'),email:f.get('email'),area:f.get('area')||'Não definida'}}else{state.user={name:f.get('email').split('@')[0],email:f.get('email'),area:'Não definida'}}save();toast('Acesso demonstrativo realizado');go('painel')}
function requireLogin(){if(!state.user){go('login');toast('Entre ou crie uma conta para continuar');return false}return true}
function dashboard(){if(!requireLogin())return;const t=totals(),balance=t.in-t.out,goal=state.goal,pct=Math.min(100,Math.round(goal.saved/Math.max(1,goal.target)*100));layout('<div class="eyebrow">Seu progresso</div><h1>Olá, '+esc(state.user.name.split(' ')[0])+' 👋</h1><p class="muted">Pequenas decisões de hoje constroem possibilidades para amanhã.</p><div class="grid" style="margin-top:22px"><div class="card col-3"><div class="stat-label">Receitas registradas</div><div class="stat-value">'+money(t.in)+'</div><div class="stat-note">Valores lançados no protótipo</div></div><div class="card col-3"><div class="stat-label">Despesas registradas</div><div class="stat-value">'+money(t.out)+'</div><div class="stat-note">Valores lançados no protótipo</div></div><div class="card col-3"><div class="stat-label">Saldo do período</div><div class="stat-value" style="color:'+(balance>=0?'var(--green)':'var(--red)')+'">'+money(balance)+'</div><div class="stat-note">Receitas menos despesas</div></div><div class="card col-3"><div class="stat-label">Cursos em andamento</div><div class="stat-value">'+Object.keys(state.progress).length+'</div><div class="stat-note">'+(state.premium?'Plano Premium ativo (simulado)':'Plano gratuito')+'</div></div><div class="card col-7"><div class="row between"><div><div class="eyebrow">Objetivo financeiro</div><h2>'+esc(goal.name)+'</h2></div><span class="tag">'+pct+'% concluído</span></div><div class="row" style="gap:20px"><div class="goal-circle" style="--pct:'+pct+'%"><strong>'+pct+'%</strong></div><div style="flex:1"><div class="stat-value">'+money(goal.saved)+'</div><div class="muted small">de '+money(goal.target)+'</div><div class="progress" style="margin:10px 0"><span style="width:'+pct+'%"></span></div><button class="btn secondary" onclick="go(\'metas\')">Ver minha meta</button></div></div></div><div class="card col-5"><div class="eyebrow">Próximas ações</div><h2>Continue avançando</h2><ul class="list"><li><span>Registrar movimentação</span><button class="btn secondary" onclick="go(\'financas\')">Adicionar</button></li><li><span>Explorar cursos</span><button class="btn secondary" onclick="go(\'cursos\')">Ver cursos</button></li><li><span>Conhecer a comunidade</span><button class="btn secondary" onclick="go(\'grupos\')">Participar</button></li></ul></div></div><div class="section-head"><h2>Movimentações recentes</h2><a class="muted small" href="#financas">Ver todas →</a></div>'+transactionList(state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4)))}
function transactionList(items){if(!items.length)return '<div class="empty">Nenhuma movimentação registrada ainda.</div>';return '<ul class="list">'+items.map(t=>'<li><span><b>'+esc(t.description)+'</b><br><small class="muted">'+esc(t.category)+' • '+new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')+'</small></span><span class="'+(t.type==='in'?'amount-in':'amount-out')+'">'+(t.type==='in'?'+ ':'− ')+money(t.amount)+'</span></li>').join('')+'</ul>'}
function finances(){if(!requireLogin())return;const t=totals();layout('<div class="eyebrow">Organização financeira</div><h1>Suas finanças</h1><p class="muted">Registre o que entra e sai. Os dados são demonstrativos e ficam neste navegador.</p><div class="grid" style="margin:20px 0"><div class="card col-4"><div class="stat-label">Receitas</div><div class="stat-value amount-in">'+money(t.in)+'</div></div><div class="card col-4"><div class="stat-label">Despesas</div><div class="stat-value amount-out">'+money(t.out)+'</div></div><div class="card col-4"><div class="stat-label">Saldo</div><div class="stat-value">'+money(t.in-t.out)+'</div></div><div class="card col-5"><h2>Adicionar movimentação</h2><form onsubmit="addTransaction(event)"><div class="field"><label>Tipo</label><select name="type"><option value="out">Despesa</option><option value="in">Receita</option></select></div><div class="field"><label>Descrição</label><input name="description" required maxlength="50" placeholder="Ex.: Transporte"></div><div class="field"><label>Categoria</label><select name="category"><option>Moradia</option><option>Alimentação</option><option>Transporte</option><option>Educação</option><option>Saúde</option><option>Lazer</option><option>Renda</option><option>Outros</option></select></div><div class="form-grid"><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Data</label><input name="date" type="date" value="'+today()+'" required></div></div><button class="btn" type="submit">Salvar movimentação</button></form></div><div class="card col-7"><div class="row between"><h2>Histórico</h2><button class="btn secondary" onclick="resetTransactions()">Restaurar exemplos</button></div>'+transactionList(state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)))+'</div></div>')}
function addTransaction(e){e.preventDefault();const f=new FormData(e.target);state.transactions.push({id:Date.now(),type:f.get('type'),description:f.get('description'),category:f.get('category'),amount:Number(f.get('amount')),date:f.get('date')});save();toast('Movimentação adicionada');render()}
function resetTransactions(){if(confirm('Restaurar os lançamentos de exemplo?')){state.transactions=structuredClone(seed.transactions);save();render()}}
function goals(){if(!requireLogin())return;const g=state.goal,p=Math.min(100,Math.round(g.saved/Math.max(1,g.target)*100)),left=Math.max(0,g.target-g.saved);layout('<div class="eyebrow">Planejamento</div><h1>Metas financeiras</h1><p class="muted">Defina um objetivo e acompanhe o quanto já conseguiu guardar.</p><div class="grid" style="margin-top:20px"><div class="card col-7"><div class="row between"><div><span class="tag orange">Sua meta atual</span><h2 style="margin-top:12px">'+esc(g.name)+'</h2></div><div class="goal-circle" style="--pct:'+p+'%"><strong>'+p+'%</strong></div></div><div class="stat-value">'+money(g.saved)+' <span class="muted small">de '+money(g.target)+'</span></div><div class="progress"><span style="width:'+p+'%"></span></div><p class="muted small" style="margin-top:12px">'+(left?('Faltam '+money(left)+' para alcançar seu objetivo.'):'Parabéns! Você atingiu o valor definido.')+'</p><div class="actions"><button class="btn" onclick="addToGoal()">Adicionar valor guardado</button><button class="btn secondary" onclick="editGoal()">Editar meta</button></div></div><div class="card col-5"><div class="feature-icon">✧</div><h3>Uma dica para começar</h3><p class="muted">Escolha um valor que caiba na sua realidade. Consistência costuma ser mais útil do que uma meta impossível de manter.</p><div class="notice">O protótipo não movimenta dinheiro nem possui integração bancária.</div></div></div>')}
function addToGoal(){const v=prompt('Quanto você conseguiu guardar? (R$)');if(v===null)return;const n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n<=0){toast('Informe um valor válido');return}state.goal.saved+=n;save();render()}
function editGoal(){const name=prompt('Nome da meta:',state.goal.name);if(name===null)return;const target=Number((prompt('Valor total desejado (R$):',state.goal.target)||'').replace(',','.'));if(!name.trim()||!Number.isFinite(target)||target<=0){toast('Confira os dados da meta');return}state.goal.name=name.trim();state.goal.target=target;save();render()}
function coursesPage(){if(!requireLogin())return;const filtered=courses.filter(c=>(courseFilter==='Todas'||c.area===courseFilter));layout('<div class="eyebrow">Aprendizado contínuo</div><h1>Cursos para dar o próximo passo</h1><p class="muted">Conteúdos organizados por área. A disponibilidade real depende de parcerias e produção de conteúdo.</p><div class="notice blue" style="margin-top:14px">A proposta comercial prevê planejamento financeiro e comunidade gratuitos. A assinatura Premium de R$ 9,99/mês daria acesso aos cursos básicos. Este protótipo apenas simula essa liberação.</div><div class="row between" style="margin-top:22px"><h2>Biblioteca de cursos</h2><span class="tag orange">'+(state.premium?'Premium ativo (demo)':'Plano gratuito')+'</span></div><div class="tabs">'+['Todas',...areas].map(a=>'<button class="tab '+(courseFilter===a?'active':'')+'" onclick="setCourseFilter(\''+a+'\')">'+a+'</button>').join('')+'</div><div class="grid">'+filtered.map(c=>{const premium=c.level==='Premium',locked=premium&&!state.premium,done=state.progress[c.title]||0;return '<article class="card course-card col-4"><div class="row between"><span class="tag">'+c.area+'</span><span class="tag '+(premium?'orange':'green')+'">'+(premium?'Premium':'Básico')+'</span></div><h3>'+c.title+'</h3><p>'+c.desc+'</p><div class="course-meta"><span>◷ '+c.duration+'</span><span>• '+(premium?'Aprofundamento':'Introdução')+'</span></div>'+(done?'<div class="progress"><span style="width:'+done+'%"></span></div><small class="muted">'+done+'% concluído</small>':'')+'<div class="course-bottom"><button class="btn '+(locked?'secondary':'')+'" onclick="openCourse(\''+c.title.replace(/'/g,"\\'")+'\')">'+(locked?'Conhecer Premium':done?'Continuar':'Acessar curso')+'</button></div></article>'}).join('')+'</div>')}
function setCourseFilter(a){courseFilter=a;coursesPage()}
function openCourse(title){const c=courses.find(x=>x.title===title);if(c.level==='Premium'&&!state.premium){if(confirm('O acesso aos cursos básicos é proposto no plano Premium de R$ 9,99/mês. Deseja simular a assinatura?'))subscribe();return}const done=state.progress[title]||0;if(confirm(c.title+'\n\n'+c.desc+'\n\nSimular avanço de 25% no curso?')){state.progress[title]=Math.min(100,done+25);save();coursesPage();toast('Progresso atualizado (demo)')}}
function subscribe(){if(!confirm('Ativar assinatura demonstrativa de R$ 9,99/mês? Nenhuma cobrança será realizada.'))return;state.premium=true;save();toast('Premium ativado apenas nesta demonstração');coursesPage()}
function community(){if(!requireLogin())return;layout('<div class="eyebrow">Troca de experiências</div><h1>Comunidade NextLevel</h1><p class="muted">Espaços demonstrativos por área de interesse.</p><div class="notice blue">Os grupos abaixo são exemplos visuais. Não há chat ou comunidade online conectada nesta versão.</div><div class="grid" style="margin-top:20px">'+areas.map(a=>'<article class="card col-4"><div class="feature-icon">◎</div><h3>'+a+'</h3><p class="muted small">Compartilhe dúvidas, referências e experiências relacionadas à área.</p><button class="btn secondary" onclick="toast(\'Grupo demonstrativo — interação ainda não conectada\')">Conhecer grupo</button></article>').join('')+'</div>')}
function about(){layout('<div class="eyebrow">Sobre o projeto</div><h1>O que é o NextLevel?</h1><div class="card" style="max-width:850px"><p style="font-size:18px">O NextLevel conecta dois desafios que fazem parte da jornada de muitos jovens adultos: desenvolver a carreira e organizar a vida financeira.</p><h2>O problema que queremos enfrentar</h2><p class="muted">Crescer profissionalmente exige acesso a oportunidades de aprendizagem. Ao mesmo tempo, planejar objetivos financeiros pode ser difícil quando a renda é limitada e as informações estão espalhadas.</p><h2>Nossa proposta</h2><ul><li>Ferramentas gratuitas para registrar receitas, despesas e metas.</li><li>Conteúdos de desenvolvimento profissional organizados por área.</li><li>Comunidade para troca de experiências.</li></ul><h2>Modelo de negócio em validação</h2><p class="muted">A proposta considera uma assinatura Premium de R$ 9,99/mês para acesso a cursos básicos. Parcerias, custos e disposição a pagar ainda precisam ser validados.</p><div class="notice">O NextLevel não promete emprego, aumento salarial ou independência financeira garantida.</div></div>')}
function privacy(){layout('<div class="eyebrow">Transparência</div><h1>Privacidade no protótipo</h1><div class="card" style="max-width:850px"><p>Esta versão é uma demonstração acadêmica. As informações inseridas ficam armazenadas no armazenamento local do navegador (localStorage) e não são enviadas a um servidor pelo protótipo.</p><p>Não informe dados bancários, senhas reais ou informações sensíveis. O login e a assinatura são simulações, sem autenticação segura ou cobrança.</p><p>Uma versão pública real precisará de política de privacidade revisada, controles de segurança, backend, gestão de consentimento e processos para atender solicitações de titulares conforme a LGPD.</p></div>')}
function logout(){state.user=null;save();go('inicio');toast('Você saiu da demonstração')}
function toggleNav(){document.getElementById('nav')?.classList.toggle('open')}
function render(){page=location.hash.slice(1)||'inicio';if(page==='inicio')return landing();if(page==='login'||page==='cadastro')return auth(page);if(page==='painel')return dashboard();if(page==='financas')return finances();if(page==='metas')return goals();if(page==='cursos')return coursesPage();if(page==='grupos')return community();if(page==='sobre')return about();if(page==='privacidade')return privacy();landing()}
window.addEventListener('hashchange',render);render();
</script></body></html>
