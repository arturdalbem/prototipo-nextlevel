<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--o:#FF8500;--b:#263CFF;--p:#8000E8;--d:#160B2D;--bg:#f5f3fb;--sf:#fff;--tx:#160B2D;--mu:#5b5473;--bd:#ddd6ee;--ok:#12805c;--er:#c4161c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.tag{background:var(--b);color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600}
.pg{height:8px;width:100%;background:var(--bd);border-radius:8px;overflow:hidden}.pg b{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--p))}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;width:100%}label{font-weight:600;font-size:14px}
input,select{padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;max-width:100%}
input:hover,select:hover{border-color:var(--p)}.f .err,input.err{border-color:var(--er)}.f .good,input.good{border-color:var(--ok)}
.msg{color:var(--er);font-size:13px}.form{max-width:440px}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px;width:100%}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars i{display:block;border-radius:8px 8px 0 0;background:linear-gradient(var(--o),var(--p));margin-bottom:4px}
.big{font-size:34px;font-weight:800}ul.l{list-style:none;margin:0;padding:0;width:100%}ul.l li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--sf);color:var(--tx);border-radius:20px;padding:24px;max-width:520px;max-height:88vh;overflow:auto;width:100%;animation:pop .2s}@keyframes pop{from{transform:scale(.94);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--d);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;transition:.25s;pointer-events:none;border-left:5px solid var(--b);max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.er{border-color:var(--er)}#toast.ok{border-color:var(--ok)}
.sw{height:64px;border-radius:12px;display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-size:12px;font-weight:600}
footer{text-align:center;padding:16px 16px 70px;color:var(--mu);font-size:13px}.lk{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0;font-weight:600}#vw{position:fixed;right:14px;bottom:14px;z-index:10;padding:10px 14px}
@container (max-width:760px){.burger{display:block}nav{display:none;flex-direction:column;align-items:stretch;flex-basis:100%}nav.open{display:flex}.sp{display:none}main{padding:20px 16px 40px}.menu{position:static;box-shadow:none;margin-top:6px}.hero{padding:28px 18px}}
</style></head><body>

const TERMOS=`<h2>Termos de Uso</h2><p class="mu">Modelo do protótipo. Precisa de revisão jurídica antes da publicação.</p><h3>1. Quem pode usar</h3><p>O NextLevel é exclusivo para pessoas com 18 anos ou mais. Ao criar a conta, você declara ter essa idade. Contas de menores de 18 anos serão encerradas e os dados excluídos.</p><h3>2. O que oferecemos</h3><p>Planejamento financeiro e grupos das áreas (gratuitos), cursos básicos (assinatura de R$ 9,99/mês) e cursos avançados (compra avulsa).</p><h3>3. Assinatura e compras</h3><p>A assinatura é mensal e pode ser cancelada a qualquer momento. Ao cancelar, os cursos básicos deixam de ser liberados. Os cursos avançados comprados continuam disponíveis.</p><h3>4. Suas responsabilidades</h3><p>Informar dados verdadeiros, manter a senha em segurança e respeitar as regras de convivência nos grupos.</p><h3>5. Conteúdo informativo</h3><p>As referências salariais são médias de mercado e não garantem ganhos. O planejamento financeiro é educativo e não substitui consultoria financeira.</p>`;
const PRIVP=`<h2>Política de Privacidade (LGPD)</h2><p class="mu">Modelo do protótipo, baseado na Lei 13.709/2018. Precisa de revisão jurídica antes da publicação.</p><h3>Quem somos</h3><p>O NextLevel é o controlador dos seus dados pessoais, nos termos da Lei Geral de Proteção de Dados (LGPD).</p><h3>Dados que tratamos</h3><p>Nome, e-mail, data de nascimento (usada só para confirmar que você tem 18 anos ou mais), área de atuação, despesas e metas que você registra e mensagens nos grupos. Dados de pagamento são tratados por um parceiro de pagamento.</p><h3>Finalidades e bases legais</h3><p>Criar e manter sua conta, prestar os serviços contratados e processar pagamentos (execução de contrato). Cumprir obrigações legais e fiscais. Enviar novidades e ofertas somente com o seu consentimento, que é separado e opcional.</p><h3>Compartilhamento</h3><p>Apenas com prestadores necessários ao serviço (pagamento e hospedagem) e com autoridades, quando a lei exigir. Não vendemos seus dados.</p><h3>Por quanto tempo guardamos</h3><p>Enquanto a conta estiver ativa e pelo prazo exigido em lei. Ao excluir a conta, apagamos ou anonimizamos os dados, salvo obrigação legal de guarda.</p><h3>Seus direitos</h3><p>Confirmar o tratamento, acessar, corrigir, anonimizar, bloquear ou eliminar dados, pedir portabilidade, saber com quem compartilhamos, revogar o consentimento e se opor a tratamentos. Use Perfil &gt; Privacidade e dados ou escreva ao encarregado (DPO): privacidade@nextlevel.example.</p><h3>Segurança</h3><p>Adotamos medidas técnicas e organizacionais para proteger os dados e comunicaremos você e a ANPD em caso de incidente relevante.</p>`;

P.inicio=()=>`<section class="hero"><h1>Evolua sua carreira e suas finanças</h1><p>Aprenda • Planeje • Conquiste. Cursos rápidos por área de atuação e organização financeira em um só app. Exclusivo para maiores de 18 anos.</p><div class="row" style="margin-top:18px"><a class="btn" style="background:var(--o);color:var(--d)" href="#cadastro">Criar conta grátis</a><a href="#login">Já tenho conta</a></div></section><div class="grid"><article class="card"><span class="tag">Grátis</span><h3>📊 Planejamento financeiro</h3><p>Registre gastos, acompanhe metas, veja a referência salarial da sua profissão e participe dos grupos das áreas. Sem custo.</p></article><article class="card"><span class="tag">Assinatura • R$ 9,99/mês</span><h3>🎓 Cursos básicos</h3><p>Cursos rápidos de todas as áreas de atuação, incluídos na assinatura.</p></article><article class="card"><span class="tag">Compra avulsa</span><h3>🚀 Cursos avançados</h3><p>Aprofunde-se na sua área com cursos vendidos individualmente.</p></article></div>`;

P.pagamento=()=>`<button class="btn sec" data-act="back">← Voltar</button><h1 style="margin-top:14px">Assinatura mensal</h1><p class="mu">Assine para liberar os cursos básicos de todas as áreas.</p><div class="card" style="max-width:440px;margin-bottom:14px"><b>Plano NextLevel</b><span class="big" style="color:var(--p)">R$ 9,99<small style="font-size:14px">/mês</small></span><span class="mu">Libera todos os cursos básicos de todas as áreas. Os cursos avançados são comprados à parte e o planejamento financeiro e os grupos das áreas continuam grátis.</span></div><form class="form" data-form="pag" novalidate>${fld('cn','Número do cartão','text','0000 0000 0000 0000','inputmode="numeric"')}${fld('vd','Validade','text','MM/AA')}${fld('cv','CVV','text','000','inputmode="numeric"')}${fld('cm','Nome no cartão','text','Como no cartão')}<button class="btn" type="submit">Assinar e entrar</button><p class="mu">Ao assinar, você mantém o aceite dos <button type="button" class="lk" data-act="termos">Termos de Uso</button> e da <button type="button" class="lk" data-act="priv">Política de Privacidade</button>. O pagamento é processado por um parceiro de pagamento.</p></form>`;
P.painel=()=>{const tot=S.exp.reduce((a,x)=>a+x.v,0),w=S.per=='Semana',d=w?[40,70,50,90,30,60,45]:[55,40,80,65],lb=w?'STQQSSD':'1234',sa=S.sa||S.area||'Todas',rec=CO.map((c,i)=>[c,i]).filter(x=>x[0][0]==S.area).slice(0,2);
return `<h1>Olá, ${esc(S.name.split(' ')[0])} 👋</h1><p class="mu">Seu painel financeiro e de carreira</p>${S.sub?'':'<section class="card" style="margin-top:16px;border-color:var(--p)"><b>Planejamento financeiro e grupos grátis 🎉</b><span class="mu">Os cursos básicos são liberados com a assinatura de R$ 9,99/mês. Os avançados são comprados à parte.</span><a class="btn" href="#pagamento">Liberar cursos</a></section>'}<div class="grid" style="margin-top:16px"><section class="card"><span class="mu">Saldo do mês</span><div class="big">${brl(S.renda-tot)}</div><span class="mu">Gastos: ${brl(tot)}</span><button class="btn" data-act="newexp">+ Nova despesa</button></section><section class="card"><div class="row" style="justify-content:space-between;width:100%"><b>Gastos</b><select data-sel="per" aria-label="Período">${['Semana','Mês'].map(p=>`<option ${p==S.per?'selected':''}>${p}</option>`).join('')}</select></div><div class="bars">${d.map((h,i)=>`<div><i style="height:${h}px"></i>${w?lb[i]:'S'+lb[i]}</div>`).join('')}</div></section><section class="card"><b>Meta: ${esc(S.goal.n)}</b><div class="pg"><b style="width:${Math.min(100,S.meta/S.goal.t*100)}%"></b></div><span class="mu">${brl(S.meta)} de ${brl(S.goal.t)}</span>${S.goal.m?`<span class="mu">⏱️ Prazo: ${S.goal.m} meses • ${brl(Math.max(0,S.goal.t-S.meta)/S.goal.m)} por mês</span>`:''}<a href="#metas">⏱️ Ver metas de tempo →</a><div class="row"><button class="btn sec" data-act="meta">+ Guardar valor</button><button class="btn sec" data-act="editgoal">✏️ Editar meta</button></div></section></div><h2>Últimas despesas</h2><section class="card"><ul class="l">${S.exp.slice(0,5).map(x=>`<li><span>${esc(x.t)}</span><b>${brl(x.v)}</b></li>`).join('')}</ul></section><h2>Referência salarial por profissão <span class="tag">Grátis</span></h2><div class="f" style="max-width:300px"><label for="sa">Área de atuação</label><select id="sa" data-sel="sal">${['Todas',...AREAS].map(a=>`<option ${a==sa?'selected':''}>${a}</option>`).join('')}</select></div><section class="card"><ul class="l">${SAL.filter(r=>sa=='Todas'||r[0]==sa).map(r=>`<li><span><b>${r[1]}</b><br><span class="mu">${r[0]} • faixa ${brl(r[3])} a ${brl(r[4])} • ${r[5]}/semana</span></span><b>${brl(r[2])}</b></li>`).join('')}</ul><span class="mu">Média do salário base com carteira assinada (CLT) no Brasil, 12 meses até meados de 2026. Fonte: Portal Salário, com dados do Novo Caged (Ministério do Trabalho e Emprego). É uma referência de mercado, não uma promessa de ganho.</span></section><h2>Recomendado para ${esc(S.area||'você')}</h2><div class="grid">${(rec.length?rec:CO.slice(0,2).map((c,i)=>[c,i])).map(([c,i])=>`<article class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><button class="btn" data-act="course" data-i="${i}">${S.sub?'Ver curso':'🔒 Bloqueado'}</button></article>`).join('')}</div><p><a href="#cursos">Ver todos os cursos →</a></p>`};
P.cursos=()=>{const f=S.f,l=CO.map((c,i)=>[c,i]).filter(x=>f=='Todas'||x[0][0]==f),al=ADV.map((c,i)=>[c,i]).filter(x=>f=='Todas'||x[0][0]==f).sort((a,b)=>AREAS.indexOf(a[0][0])-AREAS.indexOf(b[0][0])||a[1]-b[1]);
return `<h1>Cursos por área</h1>${S.sub?'':'<section class="card" style="border-color:var(--p);margin-bottom:16px"><b>🔒 Cursos básicos liberados com a assinatura</b><span class="mu">O planejamento financeiro e os grupos das áreas são grátis. Assine por R$ 9,99/mês para liberar os cursos básicos. Os cursos avançados são comprados individualmente.</span><a class="btn" href="#pagamento">Assinar e liberar</a></section>'}<div class="f" style="max-width:300px"><label for="fa">Área de atuação</label><select id="fa" data-sel="area">${['Todas',...AREAS].map(a=>`<option ${a==f?'selected':''}>${a}</option>`).join('')}</select></div><h2>Cursos básicos <span class="tag">Incluídos na assinatura</span></h2><div class="grid">${l.map(([c,i])=>{const p=S.pr[i]||0;return `<article class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[3]}</p><span class="mu">${c[2]}</span><div class="pg" role="progressbar" aria-label="Progresso" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><b style="width:${p}%"></b></div><button class="btn" data-act="course" data-i="${i}">${!S.sub?'🔒 Bloqueado':p?'Continuar':'Ver curso'}</button></article>`}).join('')}</div><h2>Cursos avançados <span class="tag">Compra avulsa</span></h2><p class="mu">Aprofunde-se na sua área com cursos vendidos individualmente.</p><div class="grid">${al.map(([c,i])=>{const own=S.adv[i],p=S.pr['a'+i]||0;return `<article class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[3]}</p><span class="mu">${c[2]}</span>${own?`<div class="pg"><b style="width:${p}%"></b></div>`:`<b style="font-size:20px">${brl(c[4])}</b>`}<button class="btn" data-act="adv" data-i="${i}">${own?(p?'Continuar':'Acessar curso'):'Comprar'}</button></article>`}).join('')}</div><h2>Grupos das áreas <span class="tag">Grátis</span></h2><p class="mu">Converse com pessoas da sua área na aba <a href="#grupos">Grupos</a>.</p><div class="grid">${[].map(a=>{const ok=gok(a);return `<article class="card"><h3>👥 ${a}</h3><span class="mu">${ok?'Grátis para todos os usuários':'🔒 Liberado ao comprar um curso avançado da área'}</span><button class="btn ${ok?'':'sec'}" data-act="group" data-a="${a}">${ok?'Entrar no grupo':'Ver como liberar'}</button></article>`}).join('')}</div>`};
const msgs=a=>S.msgs[a]||(S.msgs[a]=[{n:'Ana',t:'Alguém já fez o módulo 2?'},{n:'Carlos',t:'Vaga aberta na área, vou compartilhar!'}]);
P.grupos=()=>{const as=[...AREAS].sort((x,y)=>(y==S.area)-(x==S.area));return `<h1>Grupos das áreas <span class="tag">Grátis</span></h1><p class="mu">Converse com pessoas da sua área, troque dicas e descubra vagas.</p><div class="grid" style="margin-top:16px">${as.map(a=>{const m=msgs(a),u=m[m.length-1];return `<article class="card"><h3>👥 ${a}${a==S.area?' <span class="tag">Sua área</span>':''}</h3><span class="mu">${120+AREAS.indexOf(a)*37} membros • ${m.length} mensagens</span><p><b>${esc(u.n)}:</b> ${esc(u.t)}</p><button class="btn" data-act="group" data-a="${a}">Entrar no grupo</button></article>`}).join('')}</div>`};
P.metas=()=>{const g=S.goal,rest=Math.max(0,g.t-S.meta),opts=[[3,'Curto prazo'],[6,'Curto prazo'],[12,'Médio prazo'],[24,'Médio prazo'],[36,'Longo prazo']];
return `${back}<h1 style="margin-top:14px">Metas de tempo</h1><p class="mu">Escolha em quanto tempo quer completar a meta “${esc(g.n)}”.</p><div class="grid" style="margin:16px 0"><section class="card"><span class="mu">Meta</span><b class="big" style="font-size:26px">${brl(g.t)}</b><span class="mu">Guardado: ${brl(S.meta)} • Falta: ${brl(rest)}</span></section><section class="card"><span class="mu">Prazo escolhido</span><b class="big" style="font-size:26px">${g.m?g.m+' meses':'Nenhum'}</b>${g.m?`<span class="mu">Guarde ${brl(rest/g.m)} por mês</span>`:''}</section></div><div class="grid">${opts.map(([m,t])=>`<article class="card"><span class="tag">${t}</span><h3>${m} meses</h3><p class="mu">${rest>0?brl(rest/m)+' por mês':'Meta já concluída'}</p><button class="btn ${g.m==m?'':'sec'}" data-act="prazo" data-m="${m}">${g.m==m?'✔ Prazo definido':'Definir prazo'}</button></article>`).join('')}</div><h2>Outro prazo</h2><form class="form" data-form="prazo" novalidate>${fld('pm','Quantidade de meses','text','Ex.: 18','inputmode="numeric"')}<button class="btn" type="submit">Calcular e definir</button></form><p class="mu" style="margin-top:16px">Referência comum de educação financeira: a reserva de emergência cobre de 3 a 6 meses das suas despesas mensais.</p>`};
P['meus-cursos']=()=>{const b=CO.map((c,i)=>[c,i]).filter(x=>S.sub&&S.pr[x[1]]>0),a=ADV.map((c,i)=>[c,i]).filter(x=>S.adv[x[1]]),g=AREAS.filter(gok);
const card=(c,i,p,act)=>`<article class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><div class="pg"><b style="width:${p}%"></b></div><span class="mu">${p}% concluído</span><button class="btn" data-act="${act}" data-i="${i}">${p>=100?'Revisar':p?'Continuar':'Iniciar curso'}</button></article>`;
return `<h1>Meus cursos</h1><p class="mu">Seu plano: ${S.sub?'NextLevel (cursos básicos incluídos)':'gratuito (planejamento financeiro, grupos e cursos avançados comprados)'}</p><h2>Cursos básicos</h2>${b.length?`<div class="grid">${b.map(([c,i])=>card(c,i,S.pr[i],'course')).join('')}</div>`:`<p class="mu">${S.sub?'Nenhum curso básico iniciado. <a href="#cursos">Ver cursos</a>':'🔒 Os cursos básicos só ficam disponíveis com a assinatura ativa. <a href="#pagamento">Reativar</a>'}</p>`}<h2>Cursos avançados comprados</h2>${a.length?`<div class="grid">${a.map(([c,i])=>card(c,i,S.pr['a'+i]||0,'adv')).join('')}</div>`:`<p class="mu">Você ainda não comprou nenhum curso avançado. <a href="#cursos">Ver cursos</a></p>`}<h2>Meus grupos</h2>${g.length?`<div class="row">${g.map(x=>`<button class="btn sec" data-act="group" data-a="${x}">👥 ${x}</button>`).join('')}</div>`:`<p class="mu">Os grupos são liberados ao comprar um curso avançado.</p>`}`};
P.perfil=()=>`${back}<h1 style="margin-top:14px">Meu perfil</h1><div class="grid"><section class="card"><b>Dados</b><p>${esc(S.name)}</p><span class="mu">${esc(S.email||'sem e-mail')}</span><span class="mu">Área: ${esc(S.area||'não definida')}</span></section><section class="card"><b>Assinatura</b><p>${S.sub?'NextLevel • R$ 9,99/mês':'Plano gratuito (planejamento financeiro e grupos das áreas)'}</p>${S.sub?'<button class="btn sec" data-act="cancel">Cancelar assinatura</button>':'<a class="btn" href="#pagamento">Assinar por R$ 9,99/mês</a>'}</section></div><h2>Privacidade e dados (LGPD)</h2><section class="card"><p class="mu">${S.aceite?`Termos aceitos em ${S.aceite}. `:''}O NextLevel é exclusivo para maiores de 18 anos.</p><label style="display:flex;gap:8px;font-weight:400;align-items:center"><input type="checkbox" data-act="mk" ${S.mk?'checked':''} style="width:18px;height:18px;padding:0"> Receber novidades e ofertas por e-mail</label><div class="row"><button class="btn sec" data-act="termos">Termos de Uso</button><button class="btn sec" data-act="priv">Política de Privacidade</button></div><div class="row"><button class="btn sec" data-act="export">Baixar meus dados</button><button class="btn sec" data-act="delacc">Excluir minha conta</button></div></section><p style="margin-top:20px"><button class="btn" data-act="logout">Sair da conta</button></p>`;
P['design-system']=()=>`<h1>Design System e componentes</h1><p class="mu">Páginas 01 e 02 do arquivo Figma.</p><h2>Cores</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${[['Laranja','#FF8500'],['Azul','#263CFF'],['Roxo','#8000E8'],['Roxo escuro','#160B2D']].map(([n,h])=>`<div class="sw" style="background:${h}">${n}<br>${h}</div>`).join('')}</div><h2>Tipografia</h2><div class="card"><h1 style="margin:0">Título 40/800</h1><h2 style="margin:0">Subtítulo 22/700</h2><p>Corpo 16/400 – sans-serif geométrica, espaçamento em múltiplos de 4 e 8.</p><span class="mu">Legenda 14/400</span></div><h2>Botões</h2><div class="row"><button class="btn">Primário</button><button class="btn sec">Secundário</button><button class="btn" disabled>Desativado</button><button class="btn" data-act="tdemo-ok">Sucesso</button><button class="btn sec" data-act="tdemo-er">Erro</button><button class="btn sec" data-act="mdemo">Abrir modal</button></div><h2>Campos</h2><div class="grid"><div class="f"><label>Normal</label><input placeholder="Digite aqui"></div><div class="f"><label>Erro</label><input class="err" value="abc"><small class="msg">Mensagem de erro</small></div><div class="f"><label>Sucesso</label><input class="good" value="ok@email.com"></div></div><h2>Outros</h2><div class="row"><span class="tag">Tag</span><div class="pg" style="max-width:240px"><b style="width:60%"></b></div><div class="dd"><button class="btn sec" data-act="dd" aria-haspopup="true" aria-expanded="false">Menu suspenso ▾</button><div class="menu" hidden><a href="#inicio">Início</a><a href="#fluxos">Fluxos</a></div></div></div>`;
const L=(h,t)=>`<a class="tag" style="text-decoration:none" href="#${h}">${t}</a>`,chain=a=>a.map(x=>L(x[0],x[1])).join(' → ');
P.fluxos=()=>`<h1>Fluxos e organização</h1><p class="mu">Mapa do protótipo (página 05). Telas privadas pedem login.</p><h2>Fluxo 1 – Acesso</h2><p>${chain([['inicio','Início'],['login','Login'],['painel','Painel'],['perfil','Perfil']])} → Sair → ${L('inicio','Início')}</p><h2>Fluxo 2 – Cadastro e assinatura</h2><p>${chain([['inicio','Início'],['cadastro','Cadastro'],['pagamento','Pagamento'],['painel','Painel']])}</p><h2>Fluxo 3 – Aprendizado</h2><p>${chain([['painel','Painel'],['cursos','Cursos']])} → Modal do curso → Progresso</p><h2>Páginas do arquivo Figma</h2><ul><li>01 Design System e 02 Componentes: ${L('design-system','abrir')}</li><li>03 Telas Desktop: esta visualização em tela cheia</li><li>04 Telas Mobile: botão 🖥️ / 📱 no canto da tela</li><li>05 Protótipo e Fluxos: esta página</li></ul><p><button class="btn" data-act="view">Alternar desktop / mobile</button></p>`;
function render(){let r=cur();if(!P[r]){location.replace('#inicio');return}
if(PRIV.includes(r)&&!S.on){toast('Faça login para continuar','er');location.replace('#login');return}
if(r=='login'&&S.on){location.replace('#painel');return}
$('#app').innerHTML=head()+`<main id="main" tabindex="-1">${P[r]()}</main><footer>NextLevel • Protótipo EduEmprèn • <button class="lk" data-act="termos">Termos de Uso</button> • <button class="lk" data-act="priv">Política de Privacidade</button> • Exclusivo para maiores de 18 anos</footer>`;scrollTo(0,0);$('#main').focus({preventScroll:true})}
const num=v=>parseFloat(String(v).replace(',','.'));
const TODAY=new Date().toISOString().slice(0,10);
const age=v=>{const p=String(v).split('-').map(Number);if(p.length<3||p.some(isNaN))return 0;const n=new Date();let a=n.getFullYear()-p[0];if(n.getMonth()+1<p[1]||(n.getMonth()+1==p[1]&&n.getDate()<p[2]))a--;return a};
const H={
login(f,b){if(!chk(f,[EM,SE]))return;busy(b,'Entrando…',()=>{S.on=true;S.email=f.em.value;S.name=S.name||cap(f.em.value.split('@')[0]);toast('Login realizado com sucesso','ok');go('painel')})},
cad(f,b){const okc=f.ac.checked;f.querySelector('#ac-e').textContent=okc?'':'Aceite os Termos de Uso e a Política de Privacidade para continuar';if(!chk(f,[['nm',v=>v.length>=3,'Informe seu nome completo'],EM,SE,['ar',v=>v!=='','Selecione uma área'],['nasc',v=>{const a=age(v);return a>=18&&a<=120},'Informe uma data válida. É preciso ter 18 anos ou mais.']])||!okc)return;busy(b,'Salvando…',()=>{S.name=f.nm.value.trim();S.email=f.em.value;S.area=f.ar.value;S.f=S.area;S.mk=f.mk.checked;S.aceite=new Date().toLocaleDateString('pt-BR');S.on=true;toast('Conta criada! Explore o app à vontade','ok');go('painel')})},
pag(f,b){if(!chk(f,[['cn',v=>/^\d{16}$/.test(v.replace(/\s/g,'')),'Informe 16 dígitos'],['vd',v=>/^(0[1-9]|1[0-2])\/\d{2}$/.test(v),'Use o formato MM/AA'],['cv',v=>/^\d{3}$/.test(v),'Informe 3 dígitos'],['cm',v=>v.length>=3,'Informe o nome do cartão']]))return;busy(b,'Processando…',()=>{S.on=true;S.sub=true;S.name=S.name||'Usuário';modal('<h2>🎉 Assinatura ativada</h2><p>Plano NextLevel por R$ 9,99/mês. Todos os cursos foram liberados!</p><button class="btn" data-act="enter">Ir para o painel</button>')})},
exp(f,b){if(!chk(f,[['ds',v=>v.length>=2,'Descreva a despesa'],['vl',v=>parseFloat(v.replace(',','.'))>0,'Informe um valor maior que zero']]))return;S.exp.unshift({t:f.ds.value.trim(),v:parseFloat(f.vl.value.replace(',','.'))});closeM();toast('Despesa adicionada','ok');render()},
msg(f){const a=f.dataset.a;if(!chk(f,[['mt',v=>v.length>=1,'Escreva uma mensagem']]))return;msgs(a).push({n:S.name.split(' ')[0]||'Você',t:f.mt.value.trim()});toast('Mensagem enviada','ok');A.group({dataset:{a}})},
prazo(f){if(!chk(f,[['pm',v=>/^\d{1,3}$/.test(v)&&+v>=1&&+v<=120,'Informe de 1 a 120 meses']]))return;S.goal.m=+f.pm.value;toast('Prazo definido: '+S.goal.m+' meses','ok');render()},
add(f){if(!chk(f,[['vl',v=>num(v)>0,'Informe um valor maior que zero']]))return;S.meta+=num(f.vl.value);closeM();toast(S.meta>=S.goal.t?'Meta concluída! 🎉':'Valor guardado','ok');render()},
goal(f){if(!chk(f,[['gn',v=>v.length>=2,'Dê um nome à meta'],['gt',v=>num(v)>0,'Informe um valor maior que zero'],['gs',v=>v!==''&&num(v)>=0,'Informe quanto já guardou (pode ser 0)']]))return;S.goal={...S.goal,n:f.gn.value.trim(),t:num(f.gt.value)};S.meta=num(f.gs.value);closeM();toast('Meta atualizada','ok');render()}};
const A={
dd:t=>{const m=t.nextElementSibling;m.hidden=!m.hidden;t.setAttribute('aria-expanded',!m.hidden)},
burger:t=>{const n=$('#nv');n.classList.toggle('open');t.setAttribute('aria-expanded',n.classList.contains('open'))},
back:()=>history.length>1?history.back():go('inicio'),close:closeM,enter:()=>{closeM();go('painel')},view:()=>document.body.classList.toggle('mob'),
logout:()=>modal('<h2>Sair da conta?</h2><p>Você poderá entrar novamente quando quiser.</p><div class="row"><button class="btn" data-act="logout-ok">Sair</button><button class="btn sec" data-act="close">Cancelar</button></div>'),
'logout-ok':()=>{S.on=false;closeM();toast('Você saiu da conta','ok');go('inicio')},
cancel:()=>modal('<h2>Cancelar assinatura?</h2><p>Os cursos básicos, incluídos na assinatura, serão removidos. Os cursos avançados comprados e os grupos continuam liberados.</p><div class="row"><button class="btn" data-act="cancel-ok">Sim, cancelar</button><button class="btn sec" data-act="close">Manter plano</button></div>'),
'cancel-ok':()=>{S.sub=false;closeM();toast('Assinatura cancelada. Cursos básicos removidos','er');render()},
meta:()=>modal('<h2>Guardar valor</h2><form data-form="add" novalidate>'+fld('vl','Valor (R$)','text','0,00','inputmode="decimal"')+'<div class="row"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" data-act="close">Cancelar</button></div></form>'),
editgoal:()=>modal(`<h2>Editar meta</h2><form data-form="goal" novalidate>${fld('gn','Nome da meta','text','Ex.: Viagem, notebook, reserva',`value="${esc(S.goal.n)}"`)}${fld('gt','Valor da meta (R$)','text','0,00',`inputmode="decimal" value="${S.goal.t}"`)}${fld('gs','Quanto já guardou (R$)','text','0,00',`inputmode="decimal" value="${S.meta}"`)}<div class="row"><button class="btn" type="submit">Salvar meta</button><button class="btn sec" type="button" data-act="close">Cancelar</button></div></form>`),
newexp:()=>modal('<h2>Nova despesa</h2><form data-form="exp" novalidate>'+fld('ds','Descrição','text','Ex.: Almoço')+fld('vl','Valor (R$)','text','0,00','inputmode="decimal"')+'<div class="row"><button class="btn" type="submit">Adicionar</button><button class="btn sec" type="button" data-act="close">Cancelar</button></div></form>'),
course:t=>{const i=+t.dataset.i,c=CO[i],p=S.pr[i]||0;if(!S.sub)return modal(`<span class="tag">${c[0]}</span><h2>🔒 ${c[1]}</h2><p>Este curso é liberado para assinantes.</p><p class="mu">Assine por R$ 9,99/mês e libere todos os cursos básicos.</p><div class="row" style="margin-top:12px"><a class="btn" href="#pagamento">Assinar e liberar</a><button class="btn sec" data-act="close">Agora não</button></div>`);modal(`<span class="tag">${c[0]}</span><h2>${c[1]}</h2><p>${c[3]}</p><p class="mu">Duração: ${c[2]}</p><div class="pg"><b style="width:${p}%"></b></div><div class="row" style="margin-top:12px"><button class="btn" data-act="study" data-i="${i}">${p>=100?'Revisar':p?'Continuar':'Iniciar curso'}</button><button class="btn sec" data-act="close">Fechar</button></div>`)},
study:t=>{const i=+t.dataset.i;S.pr[i]=Math.min(100,(S.pr[i]||0)+30);closeM();toast(S.pr[i]>=100?'Curso concluído! 🎉':'Progresso salvo','ok');render()},
adv:t=>{const i=+t.dataset.i,c=ADV[i];if(S.adv[i]){const p=S.pr['a'+i]||0;return modal(`<span class="tag">${c[0]}</span><h2>${c[1]}</h2><p>${c[3]}</p><p class="mu">Duração: ${c[2]}</p><div class="pg"><b style="width:${p}%"></b></div><div class="row" style="margin-top:12px"><button class="btn" data-act="astudy" data-i="${i}">${p>=100?'Revisar':p?'Continuar':'Iniciar curso'}</button><button class="btn sec" data-act="close">Fechar</button></div>`)}modal(`<span class="tag">${c[0]}</span><h2>${c[1]}</h2><p>${c[3]}</p><p class="mu">Duração: ${c[2]}</p><b style="font-size:24px">${brl(c[4])}</b><div class="row" style="margin-top:12px"><button class="btn" data-act="buy" data-i="${i}">Comprar por ${brl(c[4])}</button><button class="btn sec" data-act="close">Agora não</button></div>`)},
buy:t=>{S.adv[+t.dataset.i]=true;closeM();toast('Compra concluída! Curso liberado','ok');render()},
astudy:t=>{const k='a'+t.dataset.i;S.pr[k]=Math.min(100,(S.pr[k]||0)+25);closeM();toast(S.pr[k]>=100?'Curso concluído! 🎉':'Progresso salvo','ok');render()},
group:t=>{const a=t.dataset.a;if(!gok(a))return modal(`<h2>👥 Grupo de ${a}</h2><p>O grupo é liberado para quem compra um curso avançado de ${a}.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="close">Ver cursos avançados</button></div>`);modal(`<h2>👥 Grupo de ${a}</h2><ul class="l"><li><span><b>Ana:</b> Alguém já fez o módulo 2?</span></li><li><span><b>Carlos:</b> Vaga aberta na área, vou compartilhar!</span></li><li><span><b>Você:</b> Bem-vindo(a) ao grupo 👋</span></li></ul><div class="row" style="margin-top:12px"><button class="btn" data-act="close">Fechar</button></div>`)},
group:t=>{const a=t.dataset.a;modal(`<h2>👥 Grupo de ${a}</h2><ul class="l" style="max-height:220px;overflow:auto">${msgs(a).map(m=>`<li><span><b>${esc(m.n)}:</b> ${esc(m.t)}</span></li>`).join('')}</ul><form data-form="msg" data-a="${a}" novalidate style="margin-top:12px">${fld('mt','Sua mensagem','text','Escreva algo para o grupo')}<div class="row"><button class="btn" type="submit">Enviar</button><button class="btn sec" type="button" data-act="close">Fechar</button></div></form>`)},
prazo:t=>{S.goal.m=+t.dataset.m;toast('Prazo definido: '+S.goal.m+' meses','ok');render()},
termos:()=>modal(TERMOS+'<button class="btn" data-act="close" style="margin-top:12px">Fechar</button>'),
priv:()=>modal(PRIVP+'<button class="btn" data-act="close" style="margin-top:12px">Fechar</button>'),
mk:t=>{S.mk=t.checked;toast(S.mk?'Consentimento de novidades ativado':'Consentimento retirado','ok')},
export:()=>toast('Pedido registrado. Você receberá seus dados por e-mail em até 15 dias','ok'),
delacc:()=>modal('<h2>Excluir minha conta?</h2><p>Apagamos ou anonimizamos seus dados pessoais, salvo o que a lei exigir guardar (por exemplo, registros de pagamento). Esta ação não pode ser desfeita.</p><div class="row"><button class="btn" data-act="delacc-ok">Excluir definitivamente</button><button class="btn sec" data-act="close">Cancelar</button></div>'),
'delacc-ok':()=>{Object.assign(S,{on:false,name:'',email:'',area:'',f:'Todas',sub:false,adv:{},pr:{},msgs:{},mk:false,aceite:''});closeM();toast('Conta excluída e dados removidos','ok');go('inicio')},
'tdemo-ok':()=>toast('Ação concluída com sucesso','ok'),'tdemo-er':()=>toast('Algo deu errado. Tente de novo','er'),
mdemo:()=>modal('<h2>Modal de exemplo</h2><p>Fecha com o botão, clique fora ou a tecla Esc.</p><button class="btn" data-act="close">Entendi</button>')};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;H[f.dataset.form]?.(f,e.submitter||f.querySelector('[type=submit]'))});
document.addEventListener('change',e=>{const s=e.target.dataset.sel;if(s=='per'){S.per=e.target.value;render()}if(s=='area'){S.f=e.target.value;render()}if(s=='sal'){S.sa=e.target.value;render()}});
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))document.querySelectorAll('.menu').forEach(m=>m.hidden=true);if(e.target.classList.contains('ov')){closeM();return}const t=e.target.closest('[data-act]');if(t)A[t.dataset.act]?.(t)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
addEventListener('hashchange',()=>{closeM();render()});render();
</script></body></html>
